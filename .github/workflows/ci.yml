name: CI

# Every job in this file invokes scripts/ci/gate.sh and nothing else. That is
# the rule, not a style preference: .githooks/pre-push runs the same script, so
# a CI failure is reproducible locally with one command, and adding a language
# cannot reopen the local/CI divergence gap.
#
#   push to a feature branch  → FAST lane   (compile + unit tests + fmt/lint)
#   pull request → main       → FULL lane   (+ sanitizers, conformance, study guide)
#   push to main              → FULL lane   (post-merge safety net)
#   schedule                  → see nightly.yml
#
# One documented exception: phase0-smoke runs Gradle directly. It needs a live
# Aeron media driver, which the gate deliberately excludes — the gate's steps
# have to be runnable on a laptop without one.
#
# See docs/polyglot/gate.md and docs/decisions/0004-defensive-gate-stack.md.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # A step skipped because a tool is missing is a failure in CI. A step skipped
  # because its sub-project has not landed yet is not — scripts/ci/lib/steps.sh.
  EMS_GATE_STRICT: '1'

jobs:
  # ---- FAST lane: feature-branch pushes --------------------------------------
  gate-fast:
    name: Gate — fast
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install toolchain
        run: scripts/ci/install-toolchain.sh --profile base

      - name: Gate (fast)
        run: scripts/ci/gate.sh fast

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # ---- FULL lane: PRs to main, and pushes to main ----------------------------
  gate-full:
    name: Gate — full
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install toolchain
        run: scripts/ci/install-toolchain.sh --profile full

      - name: Gate (full)
        run: scripts/ci/gate.sh full

      # Coverage reporting consumes what the gate's java-coverage step produced.
      # Report-only (min-coverage-* = 0): visibility, not a hard gate.
      - name: Coverage comment (PR)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/aggregate/jacocoRootReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "Test coverage"

      - name: Coverage job summary
        if: always()
        run: |
          xml=build/reports/jacoco/aggregate/jacocoRootReport.xml
          if [ ! -f "$xml" ]; then
            echo "Coverage report not found ($xml)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Last top-level LINE counter is the report total.
          line=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$xml" | tail -1)
          missed=$(echo "$line" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
          covered=$(echo "$line" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
          if [ -n "$missed" ] && [ -n "$covered" ] && [ "$((missed + covered))" -gt 0 ]; then
            pct=$(awk "BEGIN { printf \"%.1f\", 100 * $covered / ($covered + $missed) }")
            echo "**Line coverage: ${pct}%** (${covered} covered / $((covered + missed)) lines)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report present but no LINE counter found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/aggregate/html/**
          retention-days: 7

  # ---- Phase-0 smoke gate -----------------------------------------------------
  # Documented exception to "every job invokes gate.sh": this runs the Aeron
  # Cluster + Archive round-trip, which needs a live media driver. The gate's
  # steps must be runnable on a laptop without one, so this stays separate and
  # stays visible as its own check.
  phase0-smoke:
    name: Phase-0 smoke (Aeron Cluster + Archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v6.2.0

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Phase-0 smoke gate
        run: ./gradlew --no-daemon phase0Smoke

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-smoke-reports
          path: '**/build/reports/tests/phase0Smoke/**'
          retention-days: 7

# SBOM + dependency-review job dropped for now. dependency-review-action
# requires GitHub Advanced Security on private repos (free only on public),
# so it would fail the first PR. Re-add when GHAS is enabled or the repo is
# public; CycloneDX SBOM generation (anchore/sbom-action) can be restored
# independently as it works on private repos.
