name: Nightly gate

# The heavy lane, kept off the PR path so PR feedback stays under ~10 minutes.
# Adds MSan, Valgrind, Miri and the long fuzz run to the full lane.
#
# See docs/polyglot/gate.md and docs/decisions/0004-defensive-gate-stack.md.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  EMS_GATE_STRICT: '1'

jobs:
  nightly:
    name: Gate — nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install toolchain
        run: scripts/ci/install-toolchain.sh --profile nightly

      - name: Gate (nightly)
        run: scripts/ci/gate.sh nightly

      # Fuzzing only pays off if found inputs accumulate across runs, so the
      # corpus is persisted as an artifact and re-seeded on the next run.
      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            build/fuzz/corpus/**
            rust/fuzz/corpus/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: '**/build/reports/**'
          retention-days: 14
